[package]
name = "riwaq"
version = "0.1.0"
description = "Riwaq local-first project assistant"
authors = ["Riwaq contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
